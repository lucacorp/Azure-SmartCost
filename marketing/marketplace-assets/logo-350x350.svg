<svg width="350" height="350" viewBox="0 0 350 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Rectangle Background -->
  <rect width="350" height="350" rx="70" fill="url(#bgGradient)"/>
  
  <!-- Cloud Shape (Background) -->
  <g transform="translate(175, 140)" opacity="0.2">
    <path d="M 0,-40 
             C -15,-40 -25,-30 -25,-20
             C -35,-20 -45,-10 -45,0
             C -45,15 -35,25 -20,25
             L 20,25
             C 35,25 45,15 45,0
             C 45,-10 35,-20 25,-20
             C 25,-30 15,-40 0,-40 Z" 
          fill="#ffffff" 
          stroke="none"/>
  </g>
  
  <!-- Dollar Sign Icon -->
  <g transform="translate(175, 175)" filter="url(#shadow)">
    <!-- Outer Circle -->
    <circle cx="0" cy="0" r="80" fill="url(#iconGradient)" opacity="0.9"/>
    
    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Dollar Sign -->
    <g transform="scale(1.2)">
      <!-- Vertical Line -->
      <rect x="-4" y="-45" width="8" height="90" fill="#667eea" rx="4"/>
      
      <!-- S Shape -->
      <path d="M 20,-30 
               C 20,-40 10,-45 0,-45
               C -10,-45 -20,-40 -20,-30
               C -20,-20 -10,-15 0,-15
               L 10,-15
               C 15,-15 20,-10 20,0
               C 20,10 10,15 0,15
               C -10,15 -20,10 -20,0"
            fill="none" 
            stroke="#667eea" 
            stroke-width="10" 
            stroke-linecap="round"
            stroke-linejoin="round"/>
      
      <!-- Top Cap -->
      <circle cx="0" cy="-45" r="6" fill="#667eea"/>
      <!-- Bottom Cap -->
      <circle cx="0" cy="45" r="6" fill="#667eea"/>
    </g>
  </g>
  
  <!-- Subtle Graph Lines (decoration) -->
  <g transform="translate(50, 280)" opacity="0.15">
    <polyline points="0,0 40,-15 80,-10 120,-25 140,-20" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="3" 
              stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <circle cx="40" cy="-15" r="4" fill="#ffffff"/>
    <circle cx="80" cy="-10" r="4" fill="#ffffff"/>
    <circle cx="120" cy="-25" r="4" fill="#ffffff"/>
    <circle cx="140" cy="-20" r="4" fill="#ffffff"/>
  </g>
  
  <g transform="translate(170, 295)" opacity="0.15">
    <polyline points="0,0 40,-20 80,-5 120,-30 140,-15" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="3" 
              stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <circle cx="40" cy="-20" r="4" fill="#ffffff"/>
    <circle cx="80" cy="-5" r="4" fill="#ffffff"/>
    <circle cx="120" cy="-30" r="4" fill="#ffffff"/>
    <circle cx="140" cy="-15" r="4" fill="#ffffff"/>
  </g>
</svg>
