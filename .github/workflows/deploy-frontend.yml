name: Deploy Frontend to Static Web Apps

on:
  push:
    branches: [ main ]
    paths: 
      - 'smartcost-dashboard/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]
    paths: 
      - 'smartcost-dashboard/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: production
    
    steps:
    - name: 🔍 Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './smartcost-dashboard/package-lock.json'

    - name: 📥 Install dependencies
      run: |
        cd ./smartcost-dashboard
        npm ci

    # - name: 🧪 Run tests
    #   run: |
    #     cd ./smartcost-dashboard
    #     npm run test -- --coverage --watchAll=false

    - name: 🏗️ Build application
      run: |
        cd ./smartcost-dashboard
        npm run build
      env:
        CI: false
        REACT_APP_API_BASE_URL: https://smartcost-func-beta.azurewebsites.net/api
        REACT_APP_ENVIRONMENT: production

    - name: 🔐 Login to Azure with Service Principal
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: 🚀 Build and upload to Storage (auth-mode login)
      if: success()
      env:
        STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      run: |
        echo "Building frontend and uploading to Azure Storage static website (auth-mode login)..."
        cd ./smartcost-dashboard
        npm run build
        az storage blob upload-batch --source './build' --destination '$web' --account-name $STORAGE_ACCOUNT --auth-mode login --overwrite
        echo "Upload complete to storage account: $STORAGE_ACCOUNT"

    - name: ✅ Deployment notification
      if: success()
      run: |
        echo "🎉 Frontend uploaded to Azure Storage static website."
        echo "Storage account: ${{ secrets.AZURE_STORAGE_ACCOUNT }}"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
    - name: 🧹 Close Pull Request
      id: closepullrequest
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SMARTCOST }}
        action: "close"